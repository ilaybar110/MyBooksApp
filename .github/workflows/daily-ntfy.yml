name: Daily ntfy

on:
  schedule:
    # Hourly on purpose. GitHub's scheduled triggers are best-effort and are
    # dropped under load — the previous 07:00/08:00 UTC pair produced zero runs.
    # Attempting every hour survives a few misses; the script itself decides
    # whether the current Jerusalem hour is a reminder slot.
    - cron: '0 * * * *'
  workflow_dispatch:

# Never let a slow run collide with the next hour's attempt.
concurrency:
  group: daily-ntfy
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Send reminder
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/send-daily-ntfy.mjs
