name: Daily ntfy

on:
  schedule:
    # Twice an hour, deliberately off the hour. GitHub drops scheduled runs
    # under load and minute :00 is the most contended slot of all — an hourly
    # '0 * * * *' produced 9 runs in two days instead of ~48. Odd minutes are
    # far less congested, and two attempts an hour give more chances to land.
    #
    # The script does not assume it runs on time: it sends whenever a reminder
    # is due inside the daily window, so any run that lands can do the job.
    - cron: '9,39 * * * *'
  workflow_dispatch:

# Never let a slow run collide with the next hour's attempt.
concurrency:
  group: daily-ntfy
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Send reminder
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/send-daily-ntfy.mjs
